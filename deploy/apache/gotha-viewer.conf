# Gotha viewer – jediný vhost kontejneru. DocumentRoot = public/,
# RESTful routing řeší public/.htaccess (proto AllowOverride All).
<VirtualHost *:80>
    ServerName gotha-view.daelba.eu
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
